<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmic Video Galaxy</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #020208;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        /* Latar Belakang Luar Angkasa & Nebula */
        .nebula {
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(0, 255, 128, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(180, 0, 255, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(0, 150, 255, 0.08) 0%, transparent 60%);
            z-index: 1;
        }

        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(white 1px, transparent 0);
            background-size: 60px 60px;
            opacity: 0.25;
            z-index: 1;
        }

        /* Bintang Utama di Tampilan Awal */
        .core-star-container {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .core-star {
            width: 90px;
            height: 90px;
            background: radial-gradient(circle, #ffffff 0%, #76f2ff 40%, #0077ff 100%);
            border-radius: 50%;
            box-shadow: 0 0 35px #00ffff, 0 0 70px #0077ff, inset 0 0 15px white;
            animation: pulseStar 2s infinite alternate;
        }

        .core-label {
            margin-top: 20px;
            font-size: 0.95rem;
            letter-spacing: 3px;
            color: #bdf7ff;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
            animation: fadeInOut 2s infinite alternate;
        }

        @keyframes pulseStar {
            0% { transform: scale(1); box-shadow: 0 0 25px #00ffff, 0 0 50px #0077ff; }
            100% { transform: scale(1.12); box-shadow: 0 0 45px #ffffff, 0 0 90px #00ffff; }
        }

        @keyframes fadeInOut {
            0% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        /* Kontainer Galaksi (Disembunyikan sebelum diklik) */
        .galaxy {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
            opacity: 0;
            pointer-events: none;
            transform: scale(0.05);
            transition: all 1.4s cubic-bezier(0.25, 1, 0.5, 1);
        }

        .galaxy.active {
            opacity: 1;
            pointer-events: auto;
            transform: scale(1);
        }

        /* Kartu Video Melayang ala Galaksi */
        .video-card {
            position: absolute;
            width: 110px;
            height: 110px;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
            background: #111;
            transition: transform 0.4s ease, border-color 0.4s ease;
        }

        .video-card video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .video-card:hover {
            transform: scale(1.35) !important;
            z-index: 100;
            border-color: #00ffff;
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.8);
        }

        /* Tombol Kontrol Audio (Musik Latar) */
        .controls {
            position: fixed;
            top: 25px;
            right: 25px;
            z-index: 20;
            display: flex;
            gap: 12px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .controls.active {
            opacity: 1;
            pointer-events: auto;
        }

        .ctrl-btn {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(8px);
            color: white;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2rem;
            transition: background 0.3s;
        }

        .ctrl-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>

    <!-- Latar Belakang Luar Angkasa -->
    <div class="nebula"></div>
    <div class="stars"></div>

    <!-- Tampilan Awal: Satu Bintang Besar -->
    <div class="core-star-container" id="starTrigger" onclick="triggerExplosion()">
        <div class="core-star"></div>
        <div class="core-label">Klik Bintang Ini ✨</div>
    </div>

    <!-- Sistem Galaksi Video & Partikel -->
    <div class="galaxy" id="galaxySystem"></div>

    <!-- Widget Kontrol Suara -->
    <div class="controls" id="uiControls">
        <button class="ctrl-btn" onclick="toggleAudio()" title="Mute/Unmute Musik">🔊</button>
    </div>

    <!-- Audio Musik Latar (Opsional) -->
    <audio id="bgm" loop>
        <source src="https://www.bensound.com/bensound-music/bensound-romantic.mp3" type="audio/mp3">
    </audio>

    <script>
        // DAFTAR LINK VIDEO MP4 (Kamu bisa ganti URL ini dengan link video milikmu sendiri)
        const videoSources = [
            "https://assets.mixkit.co/videos/preview/mixkit-hands-holding-a-smartphone-with-a-heart-animation-43110-large.mp4",
            "https://assets.mixkit.co/videos/preview/mixkit-woman-holding-a-smartphone-with-a-green-screen-43108-large.mp4",
            "https://assets.mixkit.co/videos/preview/mixkit-romantic-couple-holding-hands-at-sunset-42867-large.mp4",
            "https://assets.mixkit.co/videos/preview/mixkit-silhouette-of-a-couple-at-sunset-41662-large.mp4",
            "https://assets.mixkit.co/videos/preview/mixkit-red-rose-petals-falling-in-slow-motion-42938-large.mp4",
            "https://assets.mixkit.co/videos/preview/mixkit-sparklers-in-the-hands-of-a-person-41712-large.mp4"
        ];

        function triggerExplosion() {
            const trigger = document.getElementById('starTrigger');
            const galaxy = document.getElementById('galaxySystem');
            const controls = document.getElementById('uiControls');
            const bgm = document.getElementById('bgm');

            // Efek animasi bintang utama membesar lalu lenyap
            trigger.style.transform = 'scale(6)';
            trigger.style.opacity = '0';
            setTimeout(() => {
                trigger.style.display = 'none';
            }, 600);

            // Munculkan galaksi dan kontrol musik
            galaxy.classList.add('active');
            controls.classList.add('active');

            // Coba putar musik latar belakang
            bgm.play().catch(e => console.log("Autoplay audio diblokir browser sampai ada interaksi tambahan."));

            // Generate elemen video berbentuk galaksi melingkar
            buildGalaxyVideos();
        }

        function buildGalaxyVideos() {
            const galaxy = document.getElementById('galaxySystem');
            galaxy.innerHTML = '';

            const totalCards = 18; // Jumlah kotak video yang beredar di galaksi
            const radiusX = window.innerWidth * 0.40;  // Lebar sebaran galaksi
            const radiusY = window.innerHeight * 0.28; // Tinggi sebaran galaksi

            for (let i = 0; i < totalCards; i++) {
                const card = document.createElement('div');
                card.className = 'video-card';

                // Perhitungan posisi matematis membentuk orbit sabuk galaksi
                const angle = (i / totalCards) * Math.PI * 2;
                const randomSpreadX = (Math.random() * 80 - 40);
                const randomSpreadY = (Math.random() * 60 - 30);
                
                const x = Math.cos(angle) * radiusX + randomSpreadX;
                const y = Math.sin(angle) * radiusY + randomSpreadY;

                card.style.transform = `translate(${x}px, ${y}px)`;

                // Ambil video dari array secara bergantian
                const videoUrl = videoSources[i % videoSources.length];

                card.innerHTML = `
                    <video autoplay loop muted playsinline>
                        <source src="${videoUrl}" type="video/mp4">
                    </video>
                `;

                galaxy.appendChild(card);
            }
        }

        let isMuted = false;
        function toggleAudio() {
            const bgm = document.getElementById('bgm');
            const btn = document.querySelector('.ctrl-btn');
            isMuted = !isMuted;
            bgm.muted = isMuted;
            btn.innerHTML = isMuted ? '🔇' : '🔊';
        }
    </script>
</body>
</html>
